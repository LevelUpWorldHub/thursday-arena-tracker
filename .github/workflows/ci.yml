name: CI

on:
  pull_request:
  push:
    branches: [main]
    # Snapshot commits only touch data/. Ignoring that path keeps the Actions bot from re-running CI, which would not push again but would queue a needless check on every ladder write.
    paths-ignore:
      - "data/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build site
        env:
          BASE_PATH: /thursday-arena-tracker/
        run: npm run build
