name: Snapshot and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: thursday-arena-tracker
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Collect leaderboard snapshot
        if: github.event_name != 'push'
        run: node scripts/snapshot.mjs
      - name: Commit snapshot data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seasons data/catalog
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: record ladder snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - run: npm ci
      - name: Build site
        env:
          BASE_PATH: /thursday-arena-tracker/
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
